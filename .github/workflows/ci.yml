name: HAY Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Commit canonical package lock once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/security-sharp-0353'
        run: |
          if git ls-tree -r HEAD --name-only | grep -qx package-lock.json; then
            echo "package-lock.json already tracked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock patched production dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: npm run typecheck
      - run: npm run quality
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hay-package-lock
          path: package-lock.json
          if-no-files-found: ignore

  render-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

  publish-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publish-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/server.mjs