name: HAY Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lock-workers:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/lock-worker-dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate worker lockfiles once
        run: |
          if git ls-tree -r HEAD --name-only | grep -qx render-worker/package-lock.json && git ls-tree -r HEAD --name-only | grep -qx publish-worker/package-lock.json; then
            echo "worker lockfiles already tracked"
            exit 0
          fi
          npm install --prefix render-worker
          npm install --prefix publish-worker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render-worker/package-lock.json publish-worker/package-lock.json
          git commit -m "Lock worker dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run quality
      - run: npm run build

  render-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

  publish-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publish-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check